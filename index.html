<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AK45 Cloud Mining</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .header {
      width: 100%;
      text-align: center;
      margin-top: 10px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #facc15;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .balance-container {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(250, 204, 21, 0.2);
      border-radius: 20px;
      padding: 20px 30px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .balance-title {
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-value {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .balance-value span {
      color: #facc15;
    }

    .mining-area {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    .mining-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
      border: 6px solid #facc15;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .mining-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
    }

    .mining-btn img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
    }

    .floating-text {
      position: absolute;
      font-size: 24px;
      font-weight: 900;
      color: #facc15;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);
      }
    }

    .stats {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-card .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
    }

    .stat-card .val {
      font-size: 16px;
      font-weight: 700;
      color: #e2e8f0;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>AK45 Mining</h1>
    <p>Fan-Token Mining Application</p>
  </div>

  <div class="balance-container">
    <div class="balance-title">Баланс $AK45</div>
    <div class="balance-value">
      <span id="balance">0.00</span>
    </div>
  </div>

  <div class="mining-area">
    <button class="mining-btn" id="mineBtn">
      <img src="logo.png" alt="AK45 Logo" id="logoImg">
    </button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Скорость</div>
      <div class="val">+0.1 / клик</div>
    </div>
    <div class="stat-card">
      <div class="label">Supply</div>
      <div class="val">45M $AK45</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let balance = parseFloat(localStorage.getItem('ak45_balance')) || 0.00;
    const balanceEl = document.getElementById('balance');
    const mineBtn = document.getElementById('mineBtn');

    balanceEl.textContent = balance.toFixed(2);

    mineBtn.addEventListener('click', (e) => {
      balance += 0.1;
      balanceEl.textContent = balance.toFixed(2);
      localStorage.setItem('ak45_balance', balance.toString());

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      showFloatingText(e);
    });

    function showFloatingText(e) {
      const rect = mineBtn.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = '+0.1';
      text.style.left = `${x}px`;
      text.style.top = `${y}px`;

      mineBtn.parentElement.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 800);
    }
  </script>
</body>
  </html>
